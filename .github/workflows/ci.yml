name: Integración continua

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificación de tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Compilación de la web
        run: npm run build -w apps/web

  navegador:
    name: Flujos del panel en el navegador (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Pruebas de Playwright (modo demo, datos ficticios)
        run: npm run test:e2e -w apps/web
      - name: App del celular en su vista web (modo demo, datos ficticios)
        run: npm run test:e2e -w apps/movil
      - name: Guardar el rastro si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rastro-playwright
          path: |
            apps/web/test-results/
            apps/movil/test-results/
          retention-days: 7

  base-de-datos:
    name: Migraciones y pruebas de RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL 16 con PostGIS y pgTAP
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-16 postgresql-16-postgis-3 postgresql-16-pgtap libtap-parser-sourcehandler-pgtap-perl
          sudo systemctl start postgresql.service
          pg_lsclusters
          sudo -u postgres psql -c "alter user postgres password 'postgres'"
      - name: Migraciones desde cero, semilla y pruebas
        run: npm run test:db
